[project]
name = "eviral-backend"
version = "0.1.0"
description = "eViral backend API (FastAPI + SQLAlchemy)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "openai>=3.37.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
