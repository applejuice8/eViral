<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Original phone photo: plain countertop, flat light -->
  <rect width="800" height="800" fill="#c9c2b8"/>
  <rect y="560" width="800" height="240" fill="#b5aca0"/>
  <!-- plate -->
  <ellipse cx="400" cy="600" rx="270" ry="60" fill="#efedea"/>
  <ellipse cx="400" cy="590" rx="250" ry="52" fill="#f8f7f5"/>
  <!-- kek lapis block: brown/cream layers -->
  <g>
    <rect x="270" y="330" width="260" height="240" rx="10" fill="#6b4423"/>
    <g>
      <rect x="270" y="330" width="260" height="24" fill="#8a5a2e"/>
      <rect x="270" y="354" width="260" height="24" fill="#d9b380"/>
      <rect x="270" y="378" width="260" height="24" fill="#7a4e26"/>
      <rect x="270" y="402" width="260" height="24" fill="#d9b380"/>
      <rect x="270" y="426" width="260" height="24" fill="#8a5a2e"/>
      <rect x="270" y="450" width="260" height="24" fill="#d9b380"/>
      <rect x="270" y="474" width="260" height="24" fill="#7a4e26"/>
      <rect x="270" y="498" width="260" height="24" fill="#d9b380"/>
      <rect x="270" y="522" width="260" height="24" fill="#8a5a2e"/>
      <rect x="270" y="546" width="260" height="24" fill="#d9b380"/>
    </g>
    <rect x="270" y="330" width="260" height="240" rx="10" fill="none" stroke="#00000022" stroke-width="2"/>
