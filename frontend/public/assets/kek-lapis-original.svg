    <rect x="540" y="480" width="110" height="12" fill="#8a5a2e"/>
    <rect x="540" y="492" width="110" height="12" fill="#d9b380"/>
    <rect x="540" y="504" width="110" height="12" fill="#7a4e26"/>
    <rect x="540" y="516" width="110" height="12" fill="#d9b380"/>
    <rect x="540" y="528" width="110" height="12" fill="#8a5a2e"/>
    <rect x="540" y="540" width="110" height="12" fill="#d9b380"/>
    <rect x="540" y="552" width="110" height="18" fill="#7a4e26"/>
  </g>
