<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="glow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="55%" stop-color="#f7dfa8"/>
      <stop offset="100%" stop-color="#c98f3d"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a2e"/>
      <stop offset="100%" stop-color="#5f3c1c"/>
    </linearGradient>
  </defs>
  <!-- AI-improved: warm festive scene, soft light -->
  <rect width="800" height="800" fill="url(#glow)"/>
  <rect y="560" width="800" height="240" fill="url(#table)"/>
  <!-- bokeh -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="120" cy="140" r="26"/>
    <circle cx="680" cy="110" r="18"/>
    <circle cx="620" cy="240" r="12"/>
    <circle cx="170" cy="300" r="10"/>
    <circle cx="740" cy="420" r="14"/>
  </g>
  <!-- glow behind cake -->
  <ellipse cx="400" cy="470" rx="240" ry="180" fill="#fff8ec" opacity="0.55"/>
  <!-- plate -->
  <ellipse cx="400" cy="606" rx="270" ry="60" fill="#e8e2d8"/>
  <ellipse cx="400" cy="596" rx="250" ry="52" fill="#ffffff"/>
  <!-- kek lapis block -->
  <g>
    <rect x="270" y="330" width="260" height="240" rx="10" fill="#6b4423"/>
    <g>
      <rect x="270" y="330" width="260" height="24" fill="#97632f"/>
      <rect x="270" y="354" width="260" height="24" fill="#e6c491"/>
      <rect x="270" y="378" width="260" height="24" fill="#85562a"/>
      <rect x="270" y="402" width="260" height="24" fill="#e6c491"/>
      <rect x="270" y="426" width="260" height="24" fill="#97632f"/>
      <rect x="270" y="450" width="260" height="24" fill="#e6c491"/>
      <rect x="270" y="474" width="260" height="24" fill="#85562a"/>
      <rect x="270" y="498" width="260" height="24" fill="#e6c491"/>
      <rect x="270" y="522" width="260" height="24" fill="#97632f"/>
      <rect x="270" y="546" width="260" height="24" fill="#e6c491"/>
    </g>
    <!-- top sheen -->
    <rect x="270" y="330" width="260" height="26" rx="10" fill="#ffffff" opacity="0.25"/>
    <rect x="270" y="330" width="260" height="240" rx="10" fill="none" stroke="#00000022" stroke-width="2"/>
  </g>
  <!-- cut slice -->
