    <rect x="540" y="480" width="110" height="12" fill="#97632f"/>
    <rect x="540" y="492" width="110" height="12" fill="#e6c491"/>
    <rect x="540" y="504" width="110" height="12" fill="#85562a"/>
    <rect x="540" y="516" width="110" height="12" fill="#e6c491"/>
    <rect x="540" y="528" width="110" height="12" fill="#97632f"/>
    <rect x="540" y="540" width="110" height="12" fill="#e6c491"/>
    <rect x="540" y="552" width="110" height="18" fill="#85562a"/>
    <rect x="540" y="480" width="110" height="14" rx="8" fill="#ffffff" opacity="0.3"/>
  </g>
  <!-- festive accents -->
